name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Core tests + Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Restore stable debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_DEBUG_KEYSTORE is not set; the runner will generate a random debug keystore."
            exit 0
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          echo "TRPG_DEBUG_KEYSTORE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "debug keystore restored (sha256: $(sha256sum "$HOME/.android/debug.keystore" | cut -d' ' -f1))"

      - name: Install SDK packages
        run: |
          yes | sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

      - name: Cache pinned llama.cpp source
        uses: actions/cache@v4
        with:
          path: third_party/llama.cpp
          key: llama-cpp-v0.9.0-cd959bae99ff4bed22bef2604f45241c09bbb8c8

      - name: Fetch pinned llama.cpp
        run: ./scripts/fetch-llama.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Core tests
        run: ./gradlew :core:test --stacktrace

      - name: App unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify APK signing certificate
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$BT/apksigner" verify --print-certs "$APK"

          EXPECTED="$(keytool -list -v -keystore "$TRPG_DEBUG_KEYSTORE" -storepass android \
              -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')"
          ACTUAL="$("$BT/apksigner" verify --print-certs "$APK" \
              | sed -n 's/.*SHA-256 digest: //p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')"

          echo "keystore cert: $EXPECTED"
          echo "apk cert     : $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::APK is not signed with the stable debug keystore (expected $EXPECTED, got $ACTUAL)"
            exit 1
          fi
          echo "APK is signed with the stable debug keystore."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: trpg-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Room schema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schema
          path: app/schemas
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
